name: Haskell-CI
on:
  - push
  - pull_request
  - merge_group
  - workflow_dispatch
jobs:
  linux:
    name: Haskell-CI - Linux - ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    timeout-minutes:
      60
    container:
      image: buildpack-deps:jammy
    continue-on-error: ${{ matrix.allow-failure }}
    strategy:
      matrix:
        include:
          - compiler: ghc-9.12.2
            compilerKind: ghc
            compilerVersion: 9.12.2
            setup-method: ghcup
            allow-failure: false
          - compiler: ghc-9.10.3
            compilerKind: ghc
            compilerVersion: 9.10.3
            setup-method: ghcup
            allow-failure: false
          - compiler: ghc-9.8.4
            compilerKind: ghc
            compilerVersion: 9.8.4
            setup-method: ghcup
            allow-failure: false
          - compiler: ghc-9.6.7
            compilerKind: ghc
            compilerVersion: 9.6.7
            setup-method: ghcup
            allow-failure: false
          - compiler: ghc-9.4.8
            compilerKind: ghc
            compilerVersion: 9.4.8
            setup-method: ghcup
            allow-failure: false
      fail-fast: false
    steps:
      - name: apt-get install
        run: |
          apt-get update
          apt-get install -y --no-install-recommends gnupg ca-certificates dirmngr curl git software-properties-common libtinfo5
      - name: Install GHCup
        run: |
          mkdir -p "$HOME/.ghcup/bin"
          curl -sL https://downloads.haskell.org/ghcup/0.1.50.1/x86_64-linux-ghcup-0.1.50.1 > "$HOME/.ghcup/bin/ghcup"
          chmod a+x "$HOME/.ghcup/bin/ghcup"
      - name: Install cabal-install
        run: |
          "$HOME/.ghcup/bin/ghcup" install cabal 3.16.0.0 || (cat "$HOME"/.ghcup/logs/*.* && false)
          echo "CABAL=$HOME/.ghcup/bin/cabal-3.16.0.0 -vnormal+nowrap" >> "$GITHUB_ENV"
      - name: Install GHC (GHCup)
        if: matrix.setup-method == 'ghcup'
        run: |
          "$HOME/.ghcup/bin/ghcup" install ghc "$HCVER" || (cat "$HOME"/.ghcup/logs/*.* && false)
          HC=$("$HOME/.ghcup/bin/ghcup" whereis ghc "$HCVER")
          HCPKG=$(echo "$HC" | sed 's#ghc$#ghc-pkg#')
          HADDOCK=$(echo "$HC" | sed 's#ghc$#haddock#')
          echo "HC=$HC" >> "$GITHUB_ENV"
          echo "HCPKG=$HCPKG" >> "$GITHUB_ENV"
          echo "HADDOCK=$HADDOCK" >> "$GITHUB_ENV"
        env:
          HCKIND: ${{ matrix.compilerKind }}
          HCNAME: ${{ matrix.compiler }}
          HCVER: ${{ matrix.compilerVersion }}
      - name: Set PATH and environment variables
        run: |
          echo "$HOME/.cabal/bin" >> $GITHUB_PATH
          echo "LANG=C.UTF-8" >> "$GITHUB_ENV"
          echo "CABAL_DIR=$HOME/.cabal" >> "$GITHUB_ENV"
          echo "CABAL_CONFIG=$HOME/.cabal/config" >> "$GITHUB_ENV"
          HCNUMVER=$(${HC} --numeric-version|perl -ne '/^(\d+)\.(\d+)\.(\d+)(\.(\d+))?$/; print(10000 * $1 + 100 * $2 + ($3 == 0 ? $5 != 1 : $3))')
          echo "HCNUMVER=$HCNUMVER" >> "$GITHUB_ENV"
          echo "ARG_TESTS=--enable-tests" >> "$GITHUB_ENV"
          echo "ARG_BENCH=--enable-benchmarks" >> "$GITHUB_ENV"
          echo "HEADHACKAGE=false" >> "$GITHUB_ENV"
          echo "ARG_COMPILER=--$HCKIND --with-compiler=$HC" >> "$GITHUB_ENV"
        env:
          HCKIND: ${{ matrix.compilerKind }}
          HCNAME: ${{ matrix.compiler }}
          HCVER: ${{ matrix.compilerVersion }}
      - name: env
        run: |
          env
      - name: write cabal config
        run: |
          mkdir -p $CABAL_DIR
          cat >> $CABAL_CONFIG <<EOF
          remote-build-reporting: anonymous
          write-ghc-environment-files: never
          remote-repo-cache: $CABAL_DIR/packages
          logs-dir:          $CABAL_DIR/logs
          world-file:        $CABAL_DIR/world
          extra-prog-path:   $CABAL_DIR/bin
          symlink-bindir:    $CABAL_DIR/bin
          installdir:        $CABAL_DIR/bin
          build-summary:     $CABAL_DIR/logs/build.log
          store-dir:         $CABAL_DIR/store
          install-dirs user
            prefix: $CABAL_DIR
          repository hackage.haskell.org
            url: http://hackage.haskell.org/
          EOF
          cat >> $CABAL_CONFIG <<EOF
          program-default-options
            ghc-options: $GHCJOBS +RTS -M3G -RTS
          EOF
          cat $CABAL_CONFIG
      - name: versions
        run: |
          $HC --version || true
          $HC --print-project-git-commit-id || true
          $CABAL --version || true
      - name: update cabal index
        run: |
          $CABAL v2-update -v
      - name: install cabal-plan
        run: |
          mkdir -p $HOME/.cabal/bin
          curl -sL https://github.com/haskell-hvr/cabal-plan/releases/download/v0.7.3.0/cabal-plan-0.7.3.0-x86_64-linux.xz > cabal-plan.xz
          echo 'f62ccb2971567a5f638f2005ad3173dba14693a45154c1508645c52289714cb2  cabal-plan.xz' | sha256sum -c -
          xz -d < cabal-plan.xz > $HOME/.cabal/bin/cabal-plan
          rm -f cabal-plan.xz
          chmod a+x $HOME/.cabal/bin/cabal-plan
          cabal-plan --version
      - name: checkout
        uses: actions/checkout@v7
        with:
          path: source
      - name: initial cabal.project for sdist
        run: |
          touch cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/." >> cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/dataframe-core" >> cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/dataframe-expr-serializer" >> cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/dataframe-parsing" >> cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/dataframe-operations" >> cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/dataframe-csv" >> cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/dataframe-csv-th" >> cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/dataframe-json" >> cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/dataframe-parquet" >> cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/dataframe-parquet-th" >> cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/dataframe-th" >> cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/dataframe-viz" >> cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/dataframe-learn" >> cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/dataframe-lazy" >> cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/dataframe-arrow-bridge" >> cabal.project
          echo "packages: $GITHUB_WORKSPACE/source/dataframe-fastcsv" >> cabal.project
          cat cabal.project
      - name: sdist
        run: |
          mkdir -p sdist
          $CABAL sdist all --output-dir $GITHUB_WORKSPACE/sdist
      - name: unpack
        run: |
          mkdir -p unpacked
          find sdist -maxdepth 1 -type f -name '*.tar.gz' -exec tar -C $GITHUB_WORKSPACE/unpacked -xzvf {} \;
      - name: generate cabal.project
        run: |
          PKGDIR_dataframe="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/dataframe-[0-9.]*')"
          echo "PKGDIR_dataframe=${PKGDIR_dataframe}" >> "$GITHUB_ENV"
          PKGDIR_dataframe_core="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/dataframe-core-[0-9.]*')"
          echo "PKGDIR_dataframe_core=${PKGDIR_dataframe_core}" >> "$GITHUB_ENV"
          PKGDIR_dataframe_expr_serializer="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/dataframe-expr-serializer-[0-9.]*')"
          echo "PKGDIR_dataframe_expr_serializer=${PKGDIR_dataframe_expr_serializer}" >> "$GITHUB_ENV"
          PKGDIR_dataframe_parsing="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/dataframe-parsing-[0-9.]*')"
          echo "PKGDIR_dataframe_parsing=${PKGDIR_dataframe_parsing}" >> "$GITHUB_ENV"
          PKGDIR_dataframe_operations="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/dataframe-operations-[0-9.]*')"
          echo "PKGDIR_dataframe_operations=${PKGDIR_dataframe_operations}" >> "$GITHUB_ENV"
          PKGDIR_dataframe_csv="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/dataframe-csv-[0-9.]*')"
          echo "PKGDIR_dataframe_csv=${PKGDIR_dataframe_csv}" >> "$GITHUB_ENV"
          PKGDIR_dataframe_csv_th="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/dataframe-csv-th-[0-9.]*')"
          echo "PKGDIR_dataframe_csv_th=${PKGDIR_dataframe_csv_th}" >> "$GITHUB_ENV"
          PKGDIR_dataframe_json="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/dataframe-json-[0-9.]*')"
          echo "PKGDIR_dataframe_json=${PKGDIR_dataframe_json}" >> "$GITHUB_ENV"
          PKGDIR_dataframe_parquet="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/dataframe-parquet-[0-9.]*')"
          echo "PKGDIR_dataframe_parquet=${PKGDIR_dataframe_parquet}" >> "$GITHUB_ENV"
          PKGDIR_dataframe_parquet_th="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/dataframe-parquet-th-[0-9.]*')"
          echo "PKGDIR_dataframe_parquet_th=${PKGDIR_dataframe_parquet_th}" >> "$GITHUB_ENV"
          PKGDIR_dataframe_th="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/dataframe-th-[0-9.]*')"
          echo "PKGDIR_dataframe_th=${PKGDIR_dataframe_th}" >> "$GITHUB_ENV"
          PKGDIR_dataframe_viz="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/dataframe-viz-[0-9.]*')"
          echo "PKGDIR_dataframe_viz=${PKGDIR_dataframe_viz}" >> "$GITHUB_ENV"
          PKGDIR_dataframe_learn="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/dataframe-learn-[0-9.]*')"
          echo "PKGDIR_dataframe_learn=${PKGDIR_dataframe_learn}" >> "$GITHUB_ENV"
          PKGDIR_dataframe_lazy="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/dataframe-lazy-[0-9.]*')"
          echo "PKGDIR_dataframe_lazy=${PKGDIR_dataframe_lazy}" >> "$GITHUB_ENV"
          PKGDIR_dataframe_arrow_bridge="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/dataframe-arrow-bridge-[0-9.]*')"
          echo "PKGDIR_dataframe_arrow_bridge=${PKGDIR_dataframe_arrow_bridge}" >> "$GITHUB_ENV"
          PKGDIR_dataframe_fastcsv="$(find "$GITHUB_WORKSPACE/unpacked" -maxdepth 1 -type d -regex '.*/dataframe-fastcsv-[0-9.]*')"
          echo "PKGDIR_dataframe_fastcsv=${PKGDIR_dataframe_fastcsv}" >> "$GITHUB_ENV"
          rm -f cabal.project cabal.project.local
          touch cabal.project
